apply plugin: 'com.android.application'

android {
    namespace "com.narmanb.megamanxrecomp"
    compileSdkVersion 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.narmanb.megamanxrecomp"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DCMAKE_BUILD_TYPE=Release",
                          "-DSNESRECOMP_SETUP_HOST=" + (project.hasProperty("setupHost") ? "ON" : "OFF")
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                          'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lint {
        abortOnError false
    }
}


def runtimeAssetsDir = layout.buildDirectory.dir("generated/runtimeAssets")

tasks.register("prepareRuntimeAssets", Copy) {
    into(runtimeAssetsDir)

    // recomp-ui skips desktop POST_BUILD asset staging on Android. Package
    // exactly the runtime files its launcher expects, preserving the same
    // external-files layout the native host uses after chdir().
    from("${rootDir}/../recomp-ui/assets/common/fonts") {
        into "assets/fonts"
    }
    from("${rootDir}/../recomp-ui/assets/common/img") {
        into "assets/img"
    }
    from("${rootDir}/../recomp-ui/assets/consoles/snes/img") {
        include "pad.tga"
        into "assets/img"
    }
    from("${rootDir}/../recomp/launcher/boxart.tga") {
        into "assets/img"
        rename { "boxart.tga" }
    }

    // These are metadata only; no ROM data or extracted game assets are
    // packaged. SetupActivity copies them to mods/preloaded/packages/.
    from("${rootDir}/../mods/preloaded/packages") {
        into "mods/preloaded/packages"
    }
}

android.sourceSets.main.assets.srcDir(runtimeAssetsDir)
tasks.named("preBuild").configure {
    dependsOn tasks.named("prepareRuntimeAssets")
}
