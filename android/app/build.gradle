apply plugin: 'com.android.application'

android {
    namespace "com.narmanb.megamanxrecomp"
    compileSdkVersion 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.narmanb.megamanxrecomp"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DCMAKE_BUILD_TYPE=Release"
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                          'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lint {
        abortOnError false
    }
}
